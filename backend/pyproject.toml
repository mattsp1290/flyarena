[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "flyarena-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.10,<2.13", "fastapi==0.135.3", "uvicorn==0.44.0", "pydantic==2.13.1"]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["flyarena_lab*"]
