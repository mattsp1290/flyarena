[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "flyarena-graph-lab"
version = "0.1.0"
description = "Private real-graph (MaleCNS) lab API. Not the connectome itself; see docs/graph-lab.md."
requires-python = ">=3.11"
dependencies = ["fastapi==0.135.3", "uvicorn==0.44.0", "pydantic==2.13.1", "numpy>=1.26,<3"]

[dependency-groups]
# `uv run pytest` installs `dependency-groups` by default (unlike
# `optional-dependencies`, which needs an explicit `--extra`) -- matching
# root `pyproject.toml`/`training/pyproject.toml`'s own convention, so the
# plan's documented `cd backend/graph_lab && uv run pytest` (WP1's own
# acceptance line) works with no extra flag.
dev = ["httpx==0.28.1", "pytest>=8.0,<9"]

[tool.setuptools]
packages = ["graph_lab"]

[tool.setuptools.package-dir]
graph_lab = "."
