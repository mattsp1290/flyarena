name: CI

# WP7's CI/performance gate: type/check, unit+integration tests, production
# build, Playwright browser smoke/controls/determinism/performance coverage,
# and the offline graph-compiler's Python invariant tests, all from a fresh
# checkout with no downloaded raw MaleCNS data (see docs/data-provenance.md
# and tests_python/test_compile.py's fixture-only design).
#
# Deliberately out of scope here: `training/` (a separate uv project with a
# CUDA-flavored torch dependency added by concurrent work on this repo) is
# not built, tested, or otherwise touched by this workflow — its wheels are
# large and platform-specific, and it is not part of this bean's CI gate.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.22.3'

jobs:
  web:
    name: Web app (check, unit tests, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Unit and integration tests (Vitest)
        run: npm run test:unit

      - name: Deploy lock test suite (bash, no SSH)
        # scripts/verify/deploy-lock.test.sh exercises scripts/deploy-lock.sh
        # entirely against a local mktemp -d scratch directory via the
        # DEPLOY_LOCK_ROOT_OVERRIDE test hook -- no SSH, no secrets, no real
        # host, so it needs nothing beyond what this job already has
        # (ubuntu-latest ships bash, mktemp, grep, sed, awk, ln, mv, date,
        # chmod). A regression here (e.g. the concurrency guard silently
        # deferring to a test-only override, or the Release: marker parser
        # matching this repo's own documentation) would otherwise only
        # surface during an actual deploy attempt.
        run: npm run test:deploy-lock

      - name: Graph-lab launch script test suite (bash, no sudo/docker/tailnet)
        # scripts/verify/graph-lab.test.sh exercises scripts/graph-lab.sh's
        # bind/origin/token validation, its DOCKER-USER egress-drop rule
        # check-and-insert logic, and --status/--uninstall reporting entirely
        # against PATH-stubbed tailscale/iptables/sudo/docker/npm -- no sudo,
        # no real container, and no real tailnet, so it needs nothing beyond
        # what this job already has.
        run: npm run test:graph-lab

      - name: Production build
        run: npm run build

      - name: Install Playwright's Chromium (with OS dependencies)
        run: npx playwright install --with-deps chromium

      - name: Browser smoke/controls/determinism/performance suite (Playwright)
        run: npm run test:e2e

      - name: Strict subpath deployment journey
        run: npm run test:subpath

      - name: Upload Playwright report and failure traces/screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          # `warn` (not `ignore`): a missing report/test-results directory
          # here would itself be a regression worth surfacing in the job
          # summary (see playwright.config.ts's CI reporter/trace config),
          # not something to silently accept.
          if-no-files-found: warn

  python:
    name: Graph compiler invariant tests (uv, fixtures only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        # `tests_python/`'s TS<->Python cross-check tests (e.g.
        # test_null_stats_cross_check.py, test_ts_import_graph_cross_check.py,
        # test_arena_config_fingerprint_cross_check.py) shell out to the real
        # TypeScript via `node_modules/.bin/tsx` and otherwise SKIP without a
        # JS toolchain -- this job previously had no Node at all, so every
        # one of those cross-checks silently skipped in CI, every run.
        # `tests_python/ts_cross_check.py` turns a missing toolchain into a
        # hard failure when `CI` is set (GitHub Actions sets it by default),
        # so this step existing is also what keeps that guard meaningful.
        # Same action version/node-version source/cache settings as the
        # `web` job above.
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up uv
        # astral-sh/setup-uv publishes only exact patch tags (no floating
        # "v10" major tag, unlike actions/checkout, actions/setup-node, and
        # actions/upload-artifact above/below) -- confirmed against the
        # GitHub API before pinning: `v10` 404s, `v10.2.0` resolves.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Run compiler invariant tests
        # tests_python drives scripts/data/{binfmt,compile,rewire}.py entirely
        # from tiny CSV fixtures under tests_python/fixtures/ -- no MaleCNS
        # raw data is downloaded or required. `--locked` fails the build
        # instead of silently re-resolving if uv.lock is ever out of sync
        # with pyproject.toml.
        run: uv run --locked pytest tests_python

  graph-lab:
    name: graph-lab security test suite (uv, no GPU/container)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Run backend/graph_lab's test suite
        # backend/graph_lab/tests/test_security.py (auth, CORS/PNA, body
        # limits, subprocess-argv safety, process-group cancellation/
        # timeout, secret-leak checks) is the plan's own stop/go gate
        # (".agents/plans/graph-lab/00-overview.md": "WP1: the security
        # test suite passes before any job engine is wired") -- previously
        # runnable only via a manual `cd backend/graph_lab && uv run
        # pytest`, with nothing wired into CI. `graph_lab`'s own
        # pyproject.toml has no torch/GPU dependency (unlike `training/`,
        # deliberately out of this workflow's scope per this file's own
        # header comment -- `graph_lab`'s Dockerfile installs with
        # `--no-deps` and relies on the pinned NVIDIA base image for
        # torch/numpy/fastapi/uvicorn/pydantic, so this uv-managed venv
        # only ever needs its own small, CPU-only pinned deps), and every
        # test in this suite fakes its own subprocess `runner` rather than
        # spawning the real esbuild-bundled Node entries or the container
        # -- so this job needs neither a GPU nor a Docker build.
        # `python -I` (isolated mode: ignores `PYTHONPATH`/user site) is
        # not required on a clean GitHub Actions runner, but matches this
        # repo's own documented local-dev workaround for a sandbox-only
        # quirk (some dev/review sandboxes force-inject a Datadog
        # `PYTHONPATH` via `/etc/ld.so.preload` regardless of the shell's
        # own environment, shadowing `typing_extensions` and breaking
        # `fastapi`/`anyio` imports -- see `backend/graph_lab/Dockerfile`'s
        # own note on the same sandbox-runtime injection). Harmless and
        # a no-op here, kept for parity so this exact command also works
        # unchanged in that sandbox.
        # `-m "not spark"`: deselects `test_reproduction.py`'s reproduction
        # checks (`@pytest.mark.spark` -- registered in this package's own
        # `pyproject.toml`), which need a real GPU, a built JS bundle
        # (`npm run graph-lab:bundle`), and `training/`'s own uv-managed
        # `torch` venv -- none of which this CPU-only, fixture-only job
        # has. Run on the Spark itself (`.agents/plans/graph-lab/
        # 02-job-engines.md`'s gate 2: on WP2's own close, and again on
        # every `scripts/graph-lab.sh --build`).
        run: uv run --locked python -I -m pytest -q -m "not spark"
        working-directory: backend/graph_lab

  dependency-report:
    name: Dependency audit and license report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production dependencies; report only, does not fail the build)
        # Reported as build evidence for triage rather than auto-failing CI on
        # a transitive advisory this project may not even be exposed to --
        # see the plan's "triage rather than blindly auto-fix major upgrades".
        # `continue-on-error` (not `|| true`): the step's own outcome is still
        # visibly "failed" in the job summary when npm audit finds something,
        # even though it doesn't block the job -- `|| true` would report a
        # flat, unconditional "success" with no signal at all.
        run: npm audit --omit=dev
        continue-on-error: true

      - name: Dependency license report
        run: npx --yes license-checker-rseidelsohn@5.0.1 --production --json --out license-report.json

      - name: Upload license report
        uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: license-report.json
          retention-days: 30
