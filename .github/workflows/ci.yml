name: CI

# WP7's CI/performance gate: type/check, unit+integration tests, production
# build, Playwright browser smoke/controls/determinism/performance coverage,
# and the offline graph-compiler's Python invariant tests, all from a fresh
# checkout with no downloaded raw MaleCNS data (see docs/data-provenance.md
# and tests_python/test_compile.py's fixture-only design).
#
# Deliberately out of scope here: `training/` (a separate uv project with a
# CUDA-flavored torch dependency added by concurrent work on this repo) is
# not built, tested, or otherwise touched by this workflow — its wheels are
# large and platform-specific, and it is not part of this bean's CI gate.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.22.3'

jobs:
  web:
    name: Web app (check, unit tests, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Unit and integration tests (Vitest)
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Install Playwright's Chromium (with OS dependencies)
        run: npx playwright install --with-deps chromium

      - name: Browser smoke/controls/determinism/performance suite (Playwright)
        run: npm run test:e2e

      - name: Strict subpath deployment journey
        run: npm run test:subpath

      - name: Upload Playwright report and failure traces/screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          # `warn` (not `ignore`): a missing report/test-results directory
          # here would itself be a regression worth surfacing in the job
          # summary (see playwright.config.ts's CI reporter/trace config),
          # not something to silently accept.
          if-no-files-found: warn

  python:
    name: Graph compiler invariant tests (uv, fixtures only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        # astral-sh/setup-uv publishes only exact patch tags (no floating
        # "v10" major tag, unlike actions/checkout, actions/setup-node, and
        # actions/upload-artifact above/below) -- confirmed against the
        # GitHub API before pinning: `v10` 404s, `v10.2.0` resolves.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Run compiler invariant tests
        # tests_python drives scripts/data/{binfmt,compile,rewire}.py entirely
        # from tiny CSV fixtures under tests_python/fixtures/ -- no MaleCNS
        # raw data is downloaded or required. `--locked` fails the build
        # instead of silently re-resolving if uv.lock is ever out of sync
        # with pyproject.toml.
        run: uv run --locked pytest tests_python

  dependency-report:
    name: Dependency audit and license report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production dependencies; report only, does not fail the build)
        # Reported as build evidence for triage rather than auto-failing CI on
        # a transitive advisory this project may not even be exposed to --
        # see the plan's "triage rather than blindly auto-fix major upgrades".
        # `continue-on-error` (not `|| true`): the step's own outcome is still
        # visibly "failed" in the job summary when npm audit finds something,
        # even though it doesn't block the job -- `|| true` would report a
        # flat, unconditional "success" with no signal at all.
        run: npm audit --omit=dev
        continue-on-error: true

      - name: Dependency license report
        run: npx --yes license-checker-rseidelsohn@5.0.1 --production --json --out license-report.json

      - name: Upload license report
        uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: license-report.json
          retention-days: 30
