[project]
name = "flyarena-training"
version = "0.1.0"
description = "Batched PyTorch port of the FlyArena arena/rate model, for GPU-accelerated CEM training and TS parity checking."
requires-python = ">=3.12"
dependencies = [
    # Pinned to the exact cu128 build verified working on this host's GB10
    # (README.md's "Setup on the Spark" GPU check); a bare lower bound would
    # let `uv lock --upgrade` silently jump to an untested build on a
    # Blackwell-class (sm_121) device with a narrow compatibility window.
    "torch==2.11.0",
    # WP2's change surface (`.agents/plans/trained-readout/02-gpu-port-and-parity.md`)
    # lists numpy as a required dependency; this port's batched world/sensor
    # step (world.py, sensors.py) uses plain torch tensors directly, so
    # numpy was unused directly at WP2. WP3's seed-sampling policy
    # (`seeds.py`'s `sample_training_seeds`, via `numpy.random.default_rng`)
    # now uses it directly.
    "numpy>=1.26,<3",
]

[project.scripts]
flyarena-train = "flyarena_training.cli:main"
flyarena-atlas = "flyarena_training.atlas_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flyarena_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
